services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  nodered:
    build: ./nodered
    ports: ["1880:1880"]
    volumes:
      - nodered_moderno_data:/data
      - ./nodered/flows.json:/data/flows.json
      - ./datos:/datos
    depends_on: [mosquitto]
volumes:
  nodered_moderno_data:
